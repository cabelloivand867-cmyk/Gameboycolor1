name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble project from uploaded files
        run: |
          mkdir -p proj/app/src/main/java/com/pocketcolor/emu
          mkdir -p proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/drawable
          mkdir -p proj/app/src/main/res/mipmap-anydpi-v26
          cp AndroidManifest.xml proj/app/src/main/
          cp MainActivity.java proj/app/src/main/java/com/pocketcolor/emu/
          cp index.html proj/app/src/main/assets/
          cp colors.xml strings.xml styles.xml proj/app/src/main/res/values/
          cp ic_foreground.xml proj/app/src/main/res/drawable/
          cp ic_launcher.xml proj/app/src/main/res/mipmap-anydpi-v26/
          cp settings.gradle gradle.properties proj/
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.pocketcolor.emu'
              compileSdk 34
              defaultConfig {
                  applicationId "com.pocketcolor.emu"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PocketColor-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
