<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pocket Color</title>

<style>
/* Layout: a single-column handheld. Screen on top, controls under the thumbs, one slim toolbar. */
:root {
  --shell: #2b2733;
  --shell-hi: #3a3544;
  --glass: #0f1a14;
  --ink: #e9e4f2;
  --ink-dim: #a49cb3;
  --key: #6b2f6f;
  --key-hot: #a64aa8;
  --dpad: #17141c;
  --edge: #54495f;
  --arrow: #4b4357;
  --key-edge: #3d1a40;
  --key-shadow: #2a1030;
  --key-ink: #f1d9f2;
  --sys: #403a4c;
  --sys-edge: #5a5068;
  --font-ui: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--shell); color: var(--ink); font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none;
}
.bar { width: 100%; max-width: 480px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.name { flex: 1 1 100%; min-width: 0; font-size: 20px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name small { display: block; font: 400 11px var(--font-mono); letter-spacing: 0; color: var(--ink-dim); text-transform: none; }
button, .btn {
  font: 600 15px var(--font-ui); letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink); background: var(--shell-hi); border: 1px solid var(--edge); border-radius: 6px;
  padding: 8px 12px; min-height: 40px; cursor: pointer;
}
button:focus-visible, .btn:focus-visible { outline: 2px solid var(--key-hot); outline-offset: 2px; }
.bar button, .bar .btn { flex: 1 1 0; text-align: center; padding-left: 8px; padding-right: 8px; }
button[aria-pressed="true"] { background: var(--key); border-color: var(--key-hot); color: var(--key-ink); }
.screen-wrap { width: 100%; max-width: 480px; background: #14111a; padding: 14px 14px 10px; border-radius: 10px 10px 36px 10px; }
.glass { position: relative; background: var(--glass); aspect-ratio: 160 / 144; border-radius: 3px; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; background: #d0f8e0; color: #201808; }
.empty h1 { margin: 0; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; text-wrap: balance; }
.empty p { margin: 0; font: 400 12px/1.4 var(--font-mono); max-width: 30ch; }
.empty .btn { background: #201808; color: #d0f8e0; border-color: #201808; }
.empty[hidden] { display: none; }
.pad { width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 8px; touch-action: none; }
#dpad { position: relative; width: min(160px, 38vw); aspect-ratio: 1; justify-self: start; touch-action: none; }
#dpad::before, #dpad::after { content: ""; position: absolute; background: var(--dpad); border-radius: 6px; box-shadow: 0 2px 0 #0b0910; }
#dpad::before { left: 33%; right: 33%; top: 0; bottom: 0; }
#dpad::after { top: 33%; bottom: 33%; left: 0; right: 0; }
#dpad i { position: absolute; width: 0; height: 0; border: 8px solid transparent; z-index: 1; }
#dpad .u { left: calc(50% - 8px); top: 8%; border-bottom-color: var(--arrow); }
#dpad .d { left: calc(50% - 8px); bottom: 8%; border-top-color: var(--arrow); }
#dpad .l { top: calc(50% - 8px); left: 8%; border-right-color: var(--arrow); }
#dpad .r { top: calc(50% - 8px); right: 8%; border-left-color: var(--arrow); }
#dpad.on-up .u { border-bottom-color: var(--key-hot); } #dpad.on-down .d { border-top-color: var(--key-hot); }
#dpad.on-left .l { border-right-color: var(--key-hot); } #dpad.on-right .r { border-left-color: var(--key-hot); }
.face { position: relative; width: min(170px, 40vw); aspect-ratio: 1.15; justify-self: end; }
.face .k { position: absolute; width: 46%; aspect-ratio: 1; border-radius: 50%; background: var(--key); border: 2px solid var(--key-edge); box-shadow: 0 3px 0 var(--key-shadow); font: 700 18px var(--font-ui); display: grid; place-items: center; touch-action: none; color: var(--key-ink); }
.face .k.on, .sys .k.on { background: var(--key-hot); transform: translateY(2px); box-shadow: none; }
.face .b { left: 2%; bottom: 8%; } .face .a { right: 2%; top: 8%; }
.sys { grid-column: 1 / -1; display: flex; justify-content: center; gap: 22px; padding-top: 6px; }
.sys .k { padding: 10px 18px; border-radius: 999px; background: var(--sys); border: 1px solid var(--sys-edge); font: 600 13px var(--font-ui); letter-spacing: .14em; text-transform: uppercase; touch-action: none; color: var(--ink); min-height: 40px; }
.foot { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 4px; }
.shell-label { font: 600 13px var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.shells { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.sw { width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid rgba(0, 0, 0, .35); background: linear-gradient(135deg, var(--c) 50%, var(--c2, var(--c)) 50%); }
.sw[aria-checked="true"] { outline: 2px solid var(--ink); outline-offset: 3px; }
.kbd { display: none; margin: 0; font: 400 11px/1.5 var(--font-mono); color: var(--ink-dim); text-align: center; }
@media (hover: hover) and (pointer: fine) { .kbd { display: block; } }
input[type=file] { display: none; }
</style>

<div class="bar">
  <div class="name" id="title">Pocket Color<small id="meta">Game Boy / Game Boy Color</small></div>
  <button id="snd" aria-pressed="true" title="Sound on or off">Sound</button>
  <button id="ff" aria-pressed="false" title="Fast forward">2x</button>
  <button id="pause" aria-pressed="false">Pause</button>
  <label class="btn" for="rom" tabindex="0" id="open">Open ROM</label>
  <input id="rom" type="file" accept=".gb,.gbc,.bin,application/octet-stream">
</div>

<div class="screen-wrap">
  <div class="glass">
    <canvas id="lcd" width="160" height="144" aria-label="Game screen"></canvas>
    <div class="empty" id="empty">
      <h1>Insert a cartridge</h1>
      <p>Open a .gb or .gbc file from your own collection. Drag one onto this screen on a computer.</p>
      <label class="btn" for="rom">Choose ROM</label>
    </div>
  </div>
</div>

<div class="pad">
  <div id="dpad" role="group" aria-label="Directional pad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
  <div class="face">
    <div class="k b" data-bit="5">B</div>
    <div class="k a" data-bit="4">A</div>
  </div>
  <div class="sys">
    <div class="k" data-bit="6">Select</div>
    <div class="k" data-bit="7">Start</div>
  </div>
</div>

<div class="foot">
  <div class="shell-label">Shell color: <span id="shellName">Midnight</span></div>
  <div class="shells" id="shells" role="radiogroup" aria-label="Shell color"></div>
  <p class="kbd">Keyboard: arrows to move, X for A, Z for B, Enter for Start, Shift for Select.</p>
</div>

<script>
/* Game Boy / Game Boy Color emulator core (no audio).
 * Usage: const gb = new GBC(romUint8Array); gb.runFrame(); draw gb.fb (Uint32Array 160x144, ABGR).
 */
(function (root) {
  'use strict';

  const Z = 0x80, N = 0x40, H = 0x20, C = 0x10;

  // 15-bit CGB color -> packed ABGR (little-endian RGBA) lookup, with mild color correction
  const LUT = new Uint32Array(32768);
  for (let c = 0; c < 32768; c++) {
    const r = c & 31, g = (c >> 5) & 31, b = (c >> 10) & 31;
    // mild LCD-style color mixing, scaled so full white stays 255
    const R = Math.min(255, Math.round((r * 26 + g * 4 + b * 2) * 255 / 992));
    const G = Math.min(255, Math.round((g * 24 + b * 8) * 255 / 992));
    const B = Math.min(255, Math.round((r * 6 + g * 4 + b * 22) * 255 / 992));
    LUT[c] = (0xFF000000 | (B << 16) | (G << 8) | R) >>> 0;
  }
  // Classic DMG green shades (ABGR)
  const DMG = [0xFFD0F8E0, 0xFF70C088, 0xFF566834, 0xFF201808];

  const BATTERY = new Set([0x03, 0x06, 0x09, 0x0D, 0x0F, 0x10, 0x13, 0x1B, 0x1E]);
  const DUTY = [0x01, 0x81, 0x87, 0x7E];
  // bits that always read back as 1 for NR10..NR52 (index = register - 0xFF10)
  const APU_MASK = [0x80, 0x3F, 0x00, 0xFF, 0xBF, 0xFF, 0x3F, 0x00, 0xFF, 0xBF, 0x7F, 0xFF, 0x9F, 0xFF, 0xBF, 0xFF,
    0xFF, 0x00, 0x00, 0xBF, 0x00, 0x00, 0x70];
  const RAM_SIZES = [0, 0, 0x2000, 0x8000, 0x20000, 0x10000];

  class GBC {
    constructor(rom) {
      this.rom = rom;
      this.title = '';
      for (let i = 0x134; i < 0x143; i++) {
        const ch = rom[i];
        if (ch >= 32 && ch < 127) this.title += String.fromCharCode(ch);
      }
      this.cgb = (rom[0x143] & 0x80) !== 0;
      this.cartType = rom[0x147];
      this.hasBattery = BATTERY.has(this.cartType);
      this.mbc = 0;
      const t = this.cartType;
      if (t >= 1 && t <= 3) this.mbc = 1;
      else if (t === 5 || t === 6) this.mbc = 2;
      else if (t >= 0x0F && t <= 0x13) this.mbc = 3;
      else if (t >= 0x19 && t <= 0x1E) this.mbc = 5;
      this.romBanks = Math.max(2, 2 << (rom[0x148] & 0x0F));
      let ramSize = RAM_SIZES[rom[0x149]] || 0;
      if (this.mbc === 2) ramSize = 512;
      this.ram = new Uint8Array(ramSize);

      this.vram = new Uint8Array(0x4000);
      this.wram = new Uint8Array(0x8000);
      this.oam = new Uint8Array(0xA0);
      this.hram = new Uint8Array(0x80);
      this.io = new Uint8Array(0x80);
      this.bgPal = new Uint8Array(64).fill(0xFF);
      this.objPal = new Uint8Array(64).fill(0xFF);
      this.fb = new Uint32Array(160 * 144).fill(0xFFFFFFFF);
      this.bgIdx = new Uint8Array(160);
      this.bgPri = new Uint8Array(160);
      this.serial = '';

      // banking
      this.ramEnable = false;
      this.bankLo = 1; this.bank2 = 0; this.mode1 = false;
      this.rom1Bank = 1; this.rom0Bank = 0; this.ramBank = 0;
      this.mbc3Sel = 0; this.latchPrev = 0; this.rtcLatch = [0, 0, 0, 0, 0];
      this.rtcStart = Date.now();
      this.mbc5Hi = 0;
      this.vbk = 0; this.wbank = 1;

      // cpu
      this.r = new Uint8Array(8); // B C D E H L - A
      this.f = 0; this.sp = 0xFFFE; this.pc = 0x100;
      this.ime = false; this.eiDelay = false; this.halted = false;
      this.ie = 0;
      this.pad = 0;
      this.speed = 0; this.speedPrep = 0;
      this.divCounter = 0; this.timaAcc = 0; this.tima = 0; this.ticked = 0;

      // ppu
      this.ly = 0; this.lineCycles = 0; this.mode = 2;
      this.statLine = false; this.windowLine = 0; this.frameReady = false;
      this.lcdOn = true;

      // hdma
      this.hdmaActive = false; this.hdmaSrc = 0; this.hdmaDst = 0; this.hdmaLen = 0;

      this.apuInit();
      this.reset();
    }

    reset() {
      const r = this.r;
      if (this.cgb) { r[7] = 0x11; this.f = 0x80; r[0] = 0x00; r[1] = 0x00; r[2] = 0xFF; r[3] = 0x56; r[4] = 0x00; r[5] = 0x0D; }
      else { r[7] = 0x01; this.f = 0xB0; r[0] = 0x00; r[1] = 0x13; r[2] = 0x00; r[3] = 0xD8; r[4] = 0x01; r[5] = 0x4D; }
      const io = this.io;
      io[0x00] = 0xCF; io[0x0F] = 0xE1; io[0x40] = 0x91; io[0x41] = 0x85; io[0x47] = 0xFC;
      io[0x48] = 0xFF; io[0x49] = 0xFF;
      io[0x24] = 0x77; io[0x25] = 0xF3; io[0x11] = 0xBF; io[0x12] = 0xF3; io[0x14] = 0xBF; io[0x16] = 0x3F;
      io[0x19] = 0xBF; io[0x1A] = 0x7F; io[0x1C] = 0x9F; io[0x1E] = 0xBF; io[0x23] = 0xBF;
      this.updateBanks();
    }

    // ---------- cartridge banking ----------
    updateBanks() {
      const nb = this.romBanks;
      if (this.mbc === 1) {
        const hi = this.bank2 << 5;
        this.rom1Bank = (hi | this.bankLo) % nb;
        this.rom0Bank = this.mode1 ? hi % nb : 0;
        this.ramBank = this.mode1 ? this.bank2 : 0;
      } else if (this.mbc === 5) {
        this.rom1Bank = ((this.mbc5Hi << 8) | this.bankLo) % nb;
        this.rom0Bank = 0;
      } else if (this.mbc === 2 || this.mbc === 3) {
        this.rom1Bank = this.bankLo % nb;
        this.rom0Bank = 0;
      } else { this.rom1Bank = 1; this.rom0Bank = 0; }
    }

    mbcWrite(a, v) {
      switch (this.mbc) {
        case 1:
          if (a < 0x2000) this.ramEnable = (v & 0xF) === 0xA;
          else if (a < 0x4000) { this.bankLo = (v & 0x1F) || 1; }
          else if (a < 0x6000) this.bank2 = v & 3;
          else this.mode1 = (v & 1) === 1;
          break;
        case 2:
          if (a < 0x4000) {
            if (a & 0x100) this.bankLo = (v & 0xF) || 1;
            else this.ramEnable = (v & 0xF) === 0xA;
          }
          break;
        case 3:
          if (a < 0x2000) this.ramEnable = (v & 0xF) === 0xA;
          else if (a < 0x4000) this.bankLo = (v & 0x7F) || 1;
          else if (a < 0x6000) { this.mbc3Sel = v; this.ramBank = v & 3; }
          else {
            if (this.latchPrev === 0 && v === 1) {
              const s = Math.floor((Date.now() - this.rtcStart) / 1000);
              this.rtcLatch = [s % 60, Math.floor(s / 60) % 60, Math.floor(s / 3600) % 24, Math.floor(s / 86400) & 0xFF, (Math.floor(s / 86400) >> 8) & 1];
            }
            this.latchPrev = v;
          }
          break;
        case 5:
          if (a < 0x2000) this.ramEnable = (v & 0xF) === 0xA;
          else if (a < 0x3000) this.bankLo = v;
          else if (a < 0x4000) this.mbc5Hi = v & 1;
          else if (a < 0x6000) this.ramBank = v & 0xF;
          break;
      }
      this.updateBanks();
    }

    cartRamRead(a) {
      if (!this.ramEnable || this.ram.length === 0) {
        if (this.mbc === 3 && this.ramEnable && this.mbc3Sel >= 8) return this.rtcLatch[this.mbc3Sel - 8] || 0;
        return 0xFF;
      }
      if (this.mbc === 3 && this.mbc3Sel >= 8) return this.rtcLatch[this.mbc3Sel - 8] || 0;
      if (this.mbc === 2) return this.ram[a & 0x1FF] | 0xF0;
      return this.ram[(this.ramBank * 0x2000 + (a & 0x1FFF)) % this.ram.length];
    }
    cartRamWrite(a, v) {
      if (!this.ramEnable || this.ram.length === 0) return;
      if (this.mbc === 3 && this.mbc3Sel >= 8) return;
      if (this.mbc === 2) { this.ram[a & 0x1FF] = v & 0xF; return; }
      this.ram[(this.ramBank * 0x2000 + (a & 0x1FFF)) % this.ram.length] = v;
    }
    getSave() { return this.hasBattery && this.ram.length ? this.ram.slice() : null; }
    loadSave(data) { if (data && this.ram.length) this.ram.set(data.subarray(0, this.ram.length)); }

    // ---------- memory bus ----------
    // CPU-visible bus access: advances time 4 cycles per access so timers/PPU are in sync mid-instruction
    rd(a) { this.tick(4); this.ticked += 4; return this.rdRaw(a); }
    wr(a, v) { this.tick(4); this.ticked += 4; this.wrRaw(a, v); }

    rdRaw(a) {
      switch (a >> 12) {
        case 0: case 1: case 2: case 3:
          return this.rom[(this.rom0Bank * 0x4000 + a) % this.rom.length];
        case 4: case 5: case 6: case 7:
          return this.rom[(this.rom1Bank * 0x4000 + (a - 0x4000)) % this.rom.length];
        case 8: case 9: return this.vram[this.vbk * 0x2000 + (a & 0x1FFF)];
        case 0xA: case 0xB: return this.cartRamRead(a);
        case 0xC: case 0xE: return this.wram[a & 0xFFF];
        case 0xD: return this.wram[this.wbank * 0x1000 + (a & 0xFFF)];
        default:
          if (a < 0xFE00) return this.wram[this.wbank * 0x1000 + (a & 0xFFF)];
          if (a < 0xFEA0) return this.oam[a - 0xFE00];
          if (a < 0xFF00) return 0xFF;
          if (a < 0xFF80) return this.ioRead(a & 0x7F);
          if (a < 0xFFFF) return this.hram[a - 0xFF80];
          return this.ie;
      }
    }

    wrRaw(a, v) {
      switch (a >> 12) {
        case 0: case 1: case 2: case 3: case 4: case 5: case 6: case 7:
          this.mbcWrite(a, v); return;
        case 8: case 9: this.vram[this.vbk * 0x2000 + (a & 0x1FFF)] = v; return;
        case 0xA: case 0xB: this.cartRamWrite(a, v); return;
        case 0xC: case 0xE: this.wram[a & 0xFFF] = v; return;
        case 0xD: this.wram[this.wbank * 0x1000 + (a & 0xFFF)] = v; return;
        default:
          if (a < 0xFE00) { this.wram[this.wbank * 0x1000 + (a & 0xFFF)] = v; return; }
          if (a < 0xFEA0) { this.oam[a - 0xFE00] = v; return; }
          if (a < 0xFF00) return;
          if (a < 0xFF80) { this.ioWrite(a & 0x7F, v); return; }
          if (a < 0xFFFF) { this.hram[a - 0xFF80] = v; return; }
          this.ie = v;
      }
    }

    ioRead(n) {
      const io = this.io;
      switch (n) {
        case 0x00: {
          const sel = io[0] & 0x30;
          let v = 0xCF | sel;
          if (!(sel & 0x10)) v &= 0xF0 | (~this.pad & 0xF);
          if (!(sel & 0x20)) v &= 0xF0 | (~(this.pad >> 4) & 0xF);
          return v | 0xC0;
        }
        case 0x04: return (this.divCounter >> 8) & 0xFF;
        case 0x05: return this.tima;
        case 0x0F: return io[0x0F] | 0xE0;
        case 0x41: return 0x80 | (io[0x41] & 0x78) | (this.ly === io[0x45] ? 4 : 0) | (this.lcdOn ? this.mode : 0);
        case 0x44: return this.ly;
        case 0x4D: return this.cgb ? ((this.speed << 7) | 0x7E | this.speedPrep) : 0xFF;
        case 0x4F: return this.cgb ? (0xFE | this.vbk) : 0xFF;
        case 0x55: return this.hdmaActive ? ((this.hdmaLen - 1) & 0x7F) : 0xFF;
        case 0x68: return this.cgb ? io[0x68] | 0x40 : 0xFF;
        case 0x69: return this.cgb ? this.bgPal[io[0x68] & 0x3F] : 0xFF;
        case 0x6A: return this.cgb ? io[0x6A] | 0x40 : 0xFF;
        case 0x6B: return this.cgb ? this.objPal[io[0x6A] & 0x3F] : 0xFF;
        case 0x70: return this.cgb ? (0xF8 | this.wbank) : 0xFF;
        default: if (n >= 0x10 && n <= 0x3F) return this.apuRead(n); return io[n];
      }
    }

    ioWrite(n, v) {
      const io = this.io;
      switch (n) {
        case 0x00: io[0] = v & 0x30; return;
        case 0x02:
          if (v === 0x81) { this.serial += String.fromCharCode(io[1]); v &= 0x7F; }
          io[2] = v; return;
        case 0x04: {
          const bit = [512, 8, 32, 128][io[7] & 3];
          if ((io[7] & 4) && (this.divCounter & bit)) this.timaInc();
          this.divCounter = 0; return;
        }
        case 0x05: this.tima = v; return;
        case 0x0F: io[0x0F] = v & 0x1F; return;
        case 0x40: {
          const was = this.lcdOn;
          io[0x40] = v;
          this.lcdOn = (v & 0x80) !== 0;
          if (was && !this.lcdOn) { this.ly = 0; this.lineCycles = 0; this.mode = 0; this.windowLine = 0; this.statLine = false; }
          else if (!was && this.lcdOn) { this.lineCycles = 0; this.mode = 2; this.ly = 0; this.updateStat(); }
          return;
        }
        case 0x41: io[0x41] = v & 0x78; this.updateStat(); return;
        case 0x44: return;
        case 0x45: io[0x45] = v; this.updateStat(); return;
        case 0x46: {
          const src = v << 8;
          for (let i = 0; i < 0xA0; i++) this.oam[i] = this.rdRaw(src + i);
          io[0x46] = v; return;
        }
        case 0x4D: if (this.cgb) this.speedPrep = v & 1; return;
        case 0x4F: if (this.cgb) this.vbk = v & 1; return;
        case 0x51: case 0x52: case 0x53: case 0x54: io[n] = v; return;
        case 0x55: this.hdmaWrite(v); return;
        case 0x68: io[0x68] = v; return;
        case 0x69: if (this.cgb) { const i = io[0x68] & 0x3F; this.bgPal[i] = v; if (io[0x68] & 0x80) io[0x68] = 0x80 | ((i + 1) & 0x3F); } return;
        case 0x6A: io[0x6A] = v; return;
